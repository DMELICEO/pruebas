<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estudio PDF - Organizador</title>
    <link rel="stylesheet" href="styles.css">
    <!-- CSS necesario para la capa de texto de PDF.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.min.css">
    <!-- Librerías: PDF.js y localForage -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
</head>
<body>

    <!-- CABECERA -->
    <header class="app-header">
        <h1>Mi Estudio</h1>
        <div class="view-toggles">
            <button id="btnGrid" class="active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </button>
            <button id="btnList">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </button>
        </div>
    </header>

    <main class="app-content">
        <!-- SECCIÓN: LIBRERÍA PDF -->
        <section id="pdf-section" class="active-section">
            <div class="upload-container">
                <label for="pdf-upload" class="upload-btn">
                    + Cargar Nuevo PDF
                </label>
                <input type="file" id="pdf-upload" accept="application/pdf" hidden>
            </div>
            
            <div id="pdf-container" class="pdf-grid">
                <!-- Tarjetas de PDF se inyectan aquí -->
            </div>
        </section>

        <!-- SECCIÓN: CALENDARIO -->
        <section id="calendar-section" class="hidden-section">
            <div class="calendar-header">
                <button id="prev-month" class="month-nav">&lt;</button>
                <h2 id="month-year"></h2>
                <button id="next-month" class="month-nav">&gt;</button>
            </div>
            <div class="calendar-grid" id="calendar">
                <!-- Días del calendario se inyectan aquí -->
            </div>
        </section>
    </main>

    <!-- NAVEGACIÓN INFERIOR (Estilo iOS) -->
    <nav class="bottom-nav">
        <button id="nav-pdfs" class="active">Archivos</button>
        <button id="nav-calendar">Calendario</button>
    </nav>

    <!-- MODAL LECTOR PDF -->
    <div id="pdf-viewer-modal" class="modal">
        <div class="modal-header">
            <button id="close-modal" class="btn-icon">Cerrar</button>
            <span id="pdf-title" class="truncate">Leyendo...</span>
            <button id="highlight-tool" class="btn-text">Subrayar</button>
        </div>
        
        <div class="modal-body" id="viewer-container">
            <div id="page-wrapper" class="page-wrapper">
                <canvas id="pdf-render"></canvas>
                <div id="text-layer" class="textLayer"></div>
            </div>
        </div>
        
        <div class="modal-footer">
            <button id="prev-page" class="btn-icon">Anterior</button>
            <div class="page-info"><span id="page-num">1</span> / <span id="page-count">--</span></div>
            <button id="next-page" class="btn-icon">Siguiente</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
