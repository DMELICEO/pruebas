<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estudio PDF - Organizador</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
</head>
<body>

    <!-- APLICACIÓN PRINCIPAL (Librería y Calendario) -->
    <div id="main-app">
        <header class="app-header">
            <h1>Mi Estudio</h1>
            <div class="view-toggles">
                <button id="btnGrid" class="active">Cuadrícula</button>
                <button id="btnList">Lista</button>
            </div>
        </header>

        <main class="app-content">
            <section id="pdf-section" class="active-section">
                <div class="upload-container">
                    <label for="pdf-upload" class="upload-btn">
                        + Cargar PDFs
                    </label>
                    <!-- El atributo "multiple" permite subir varios a la vez -->
                    <input type="file" id="pdf-upload" accept="application/pdf" multiple hidden>
                </div>
                
                <div id="pdf-container" class="pdf-grid"></div>
            </section>

            <section id="calendar-section" class="hidden-section">
                <div class="calendar-header">
                    <button id="prev-month" class="month-nav">&lt;</button>
                    <h2 id="month-year"></h2>
                    <button id="next-month" class="month-nav">&gt;</button>
                </div>
                <div class="calendar-grid" id="calendar"></div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button id="nav-pdfs" class="active">Archivos</button>
            <button id="nav-calendar">Calendario</button>
        </nav>
    </div>

    <!-- PANTALLA DE LECTURA DE PDF (Separada y a Pantalla Completa) -->
    <div id="reader-screen" class="hidden-section">
        <div class="reader-header">
            <button id="close-reader" class="btn-text">&lt; Volver</button>
            <span id="pdf-title" class="truncate">Leyendo...</span>
            <div class="reader-tools">
                <button id="undo-highlight" class="btn-text text-red">Deshacer</button>
                <button id="highlight-tool" class="btn-text">Subrayar</button>
            </div>
        </div>
        
        <div class="reader-body" id="viewer-container">
            <div id="page-wrapper" class="page-wrapper">
                <canvas id="pdf-render"></canvas>
                <div id="text-layer" class="textLayer"></div>
                <!-- Los subrayados guardados se inyectarán aquí -->
            </div>
        </div>
        
        <div class="reader-footer">
            <button id="prev-page" class="btn-icon">Anterior</button>
            <div class="page-info"><span id="page-num">1</span> / <span id="page-count">--</span></div>
            <button id="next-page" class="btn-icon">Siguiente</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
